# environment.yml
#
# Reproducible environment for the anchovy pipeline. Creates a single conda
# environment containing everything the workflow needs: the compiled
# bioinformatics tools (minimap2, samtools), the workflow manager (snakemake),
# R + the annotation packages (only needed if you regenerate golden fixtures --
# the pipeline itself no longer depends on R), and the Python libraries the
# anchovy package builds on.
#
# WHY THIS SHAPE (see README for the full rationale):
#   - Conda provides all COMPILED / binary deps (minimap2, samtools, pysam,
#     numpy, pandas, biopython). Letting conda manage these keeps the binary
#     dependency set mutually compatible.
#   - The anchovy package itself is installed SEPARATELY and editable, as a
#     documented second step (`pip install -e .`), because editable installs are
#     on-disk links, not packages, and don't belong in a reproducible env file.
#
# SETUP (two steps -- see README):
#   conda env create -f environment.yml
#   conda activate anchovy
#   pip install -e .          # editable install of the anchovy package itself

name: anchovy

channels:
  - conda-forge
  - bioconda

dependencies:
  # --- Python runtime ---
  - python=3.12

  # --- compiled bioinformatics tools (the reason we need conda at all) ---
  - minimap2>=2.28
  - samtools>=1.20

  # --- SRA download, for the worked examples under examples/ ---
  #     Provides prefetch / fasterq-dump. Not needed to run the pipeline on data
  #     you already have; only examples/eva71_sra/fetch.sh uses it.
  - sra-tools>=3.0

  # --- workflow manager ---
  - snakemake-minimal>=9

  # --- Python libraries the anchovy package builds on (conda-provided so their
  #     compiled parts stay compatible; pip installs only the package itself) ---
  - numpy>=1.22
  - pandas>=2.0
  - pysam>=0.22
  - biopython>=1.81
  - python-levenshtein>=0.12

  # --- dev / test tooling ---
  - pytest>=8.0
  - pytest-cov
  - ruff

  # --- R + annotation packages: ONLY needed to regenerate the R golden
  #     fixtures (tests/annotate_analysis.R). The pipeline itself uses the
  #     Python port and does not require R. Comment these out if you don't need
  #     to re-freeze goldens -- they make the env noticeably heavier. ---
  - r-base>=4.3
  - r-data.table
  - bioconductor-biostrings
  - bioconductor-decipher
  - r-purrr

  # --- R packages for visualization/anchovy_report.rmd, the QC/results
  #     report rendered from a run's output directory. igraph/ggraph are
  #     optional -- the report's network panel degrades gracefully without
  #     them -- but the rest are required for the report to render at all. ---
  - r-rmarkdown
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-readr
  - r-scales
  - r-tibble
  - r-knitr
  - r-igraph
  - r-ggraph

  # pip section runs LAST (conda builds it after all conda packages). We do NOT
  # put the editable anchovy install here -- see the two-step setup above.
  # Left empty intentionally; every runtime dep is conda-provided.
