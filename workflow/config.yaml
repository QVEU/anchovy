# workflow/config.yaml
#
# Run-specific settings for the anchovy Snakemake workflow. Edit this file (not
# the Snakefile) to point the pipeline at different data or tweak parameters --
# the workflow-level equivalent of the package's config.py.
#
# Currently pointed at the test fixtures for development against known data.

# --- input: a folder of FASTQs ----------------------------------------------- #
# THIS IS THE WHOLE INTERFACE. Point it at a directory and every FASTQ in it
# (.fastq/.fq, plain or .gz) is run through the entire pipeline -- map, extract,
# per-cell consensus, genotypes, networks, report -- with outputs named after
# the FASTQ. Adding a sample means dropping a file in.
#
# It is also where the run LIVES. Outputs go to <input_dir>/results/<name>/ and
# the downloaded whitelist to <input_dir>/resources/, so the reads, this config
# and everything derived from them are one self-contained directory -- the same
# command gives the same files from any shell, and archiving the run means
# archiving one folder. Your reads themselves are never written to.
#
# The intended layout, then, is this file sitting beside the FASTQs it describes:
#
#   my_experiment/
#       config.yaml           <- this file
#       sample_A.fastq.gz
#       sample_B.fastq.gz
#       resources/            <- appears on the first run
#       results/sample_A/ ... <- appears on the first run
input_dir: "tests/data/fastqs"

# --- where the outputs go ---------------------------------------------------- #
# Both default to a subdirectory of input_dir, which is what you want unless one
# of these applies. Full paths.
#
# results_dir    the reads are on a read-only mount, or the outputs belong on a
#                faster or larger disk than the reads
# resources_dir  share one whitelist cache between runs -- the v3 list is ~100 MB
#                and byte-identical every time, so downloading it per run is
#                waste. Point every config at the same directory.
#
# results_dir: "/scratch/me/anchovy_runs/experiment1"
# resources_dir: "/scratch/me/anchovy_whitelists"
#
# Snakemake's own .snakemake/ bookkeeping still lands wherever you launch from.
# That one is Snakemake's, not anchovy's, and is safe to delete between runs.

# --- 10X chemistry: one key, because the halves must agree ------------------- #
# `chemistry` sets BOTH the signature and the whitelist, and they cannot come
# apart. The signature's N-run carries the layout (anchovy derives the UMI width
# as len(signature) - 48, so v2 and v3 differ only in the N count). The
# whitelist is not derived and IS chemistry-specific -- 737,280 barcodes against
# 6,794,880 -- and mismatching the pair does not fail: every read is assigned to
# its nearest entry in the wrong list, and the cells, consensus sequences and
# genotypes that come out look ordinary and are wrong.
#
#   v3  16 nt barcode + 12 nt UMI, 3M-february-2018.txt   (current chemistry)
#   v2  16 nt barcode + 10 nt UMI, 737K-august-2016.txt
chemistry: "v3"

# BOTH CHEMISTRIES DOWNLOAD AUTOMATICALLY. The whitelist is fetched once into
# resources_dir, shared by every sample, and its barcode count is verified
# before anything is allowed to use it -- so a mirror that quietly serves the
# wrong file fails the run rather than producing wrong cells. Leave `whitelist`
# unset and there is nothing to do.
#
# Override it when you have a run-specific barcode list -- the usual case being
# the cell barcodes called from your own Illumina run by Cell Ranger and Seurat,
# which restricts the analysis to cells you have already validated:
#
#   whitelist: "path/to/filtered_barcodes.txt"  # one 16 nt barcode per line
#
# You still set `chemistry`, because it also sets the read signature; the
# barcode is 16 nt in both v2 and v3, so a custom list does not tell the
# workflow which chemistry produced it. A list is checked on load for the
# things that silently produce nonsense -- the "-1" GEM-well suffix Cell Ranger
# writes, mixed widths, non-ACGTN characters -- and the error names the fix.
#
# `whitelist_url` points the download at your own mirror instead.
whitelist: "tests/data/whitelist.txt"

# `signature` overrides the one derived from `chemistry`, for an assay whose
# handles differ from 10X's. The N count still has to match the whitelist.

# Reference/template FASTA that minimap2 maps each per-cell FASTA against.
# (This was the $3 argument to AnchovyJob.sh.)
template: "tests/data/template.fasta"

# --- Region-aware annotation (optional) ------------------------------------- #
# Uncomment `gff` to annotate mutations against a genome region model instead of
# assuming a single ORF read in frame 1 from its first base. A GFF3 gets you:
#
#   * non-coding regions annotated at all (UTRs, stem-loops), instead of silently
#     translated as though they were coding;
#   * frame-correct residue numbers, taken from the feature's own start and phase
#     rather than from position 1 of the reference;
#   * one row per (mutation x containing region), so a variant inside both a
#     polyprotein and a mature protein is numbered in BOTH frames of reference;
#   * both strands handled, driven by the GFF3's strand and phase columns.
#
# It adds {sample}_regionAnnotations.csv to the outputs. The existing
# {sample}_annot_v3.csv is still written, with its columns filled in from each
# mutation's primary (first-listed containing) region, so nothing downstream
# needs to change.
#
# Setting `gff` also switches the consensus stage into whole-reference mode,
# because region lookup needs genome coordinates and the default mode renumbers
# positions relative to the ORF. In that mode orf_start/orf_end stop being a cut
# and become an optional analysis window over the covered core.
#
#   gff: "path/to/regions.gff3"
#
# To keep genome coordinates WITHOUT a region model, set this instead:
#
#   whole_reference: true
