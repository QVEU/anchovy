# workflow/config.yaml
#
# Run-specific settings for the anchovy Snakemake workflow. Edit this file, not
# the Snakefile, to point the pipeline at different data. Every setting the
# workflow accepts is listed in README.md; this file explains the ones whose
# wrong value does not produce an error.
#
# AS SHIPPED THIS IS A RUNNABLE EXAMPLE, not a template to fill in:
#
#   snakemake -s workflow/Snakefile --configfile workflow/config.yaml --cores 4
#
# runs the whole pipeline on the bundled fixture in seconds, which is the
# quickest way to confirm an install works. Outputs go to
# tests/data/fastqs/results/example/ and are gitignored; delete that directory
# to start over. tests/make_fastq_fixtures.py says what the fixture contains.

# --- input: a folder of FASTQs ----------------------------------------------- #
# THIS IS THE WHOLE INTERFACE. Every FASTQ in the directory (.fastq/.fq, plain
# or .gz) is run through the entire pipeline, with outputs named after it, so
# adding a sample means dropping a file in.
#
# It is also where the run LIVES: results/ and resources/ are created inside it
# and your reads are never written to, which makes a run one self-contained
# directory and its outputs independent of where you launched from. README.md
# has the full layout, and `results_dir` / `resources_dir` move either half out
# -- worth setting resources_dir when several runs can share one whitelist
# cache, since the v3 list is ~100 MB and byte-identical every time.
input_dir: "tests/data/fastqs"

# --- 10X chemistry: one key, because the halves must agree ------------------- #
# `chemistry` sets BOTH the signature and the whitelist, and they cannot come
# apart. The signature's N-run carries the layout (anchovy derives the UMI width
# as len(signature) - 48, so v2 and v3 differ only in the N count). The
# whitelist is not derived and IS chemistry-specific -- 737,280 barcodes against
# 6,794,880 -- and mismatching the pair does not fail: every read is assigned to
# its nearest entry in the wrong list, and the cells, consensus sequences and
# genotypes that come out look ordinary and are wrong.
#
#   v3  16 nt barcode + 12 nt UMI, 3M-february-2018.txt   (current chemistry)
#   v2  16 nt barcode + 10 nt UMI, 737K-august-2016.txt
chemistry: "v3"

# BOTH CHEMISTRIES DOWNLOAD AUTOMATICALLY. The whitelist is fetched once into
# resources_dir, shared by every sample, and its barcode count is verified
# before anything is allowed to use it -- so a mirror that quietly serves the
# wrong file fails the run rather than producing wrong cells. Leave `whitelist`
# unset and there is nothing to do.
#
# Override it when you have a run-specific barcode list -- the usual case being
# the cell barcodes called from your own Illumina run by Cell Ranger and Seurat,
# which restricts the analysis to cells you have already validated:
#
#   whitelist: "path/to/filtered_barcodes.txt"  # one 16 nt barcode per line
#
# You still set `chemistry`, because it also sets the read signature; the
# barcode is 16 nt in both v2 and v3, so a custom list does not tell the
# workflow which chemistry produced it. A list is checked on load for the
# things that silently produce nonsense -- the "-1" GEM-well suffix Cell Ranger
# writes, mixed widths, non-ACGTN characters -- and the error names the fix.
#
# `whitelist_url` points the download at your own mirror instead.
#
# The fixture's six barcodes, sitting beside the reads -- which is also where a
# real run-specific list belongs, since it comes from the same Illumina run.
# Omit this key entirely and the chemistry-matched 10X list downloads instead.
whitelist: "tests/data/fastqs/whitelist.txt"

# `signature` overrides the one derived from `chemistry`, for an assay whose
# handles differ from 10X's. The N count still has to match the whitelist.

# Reference/template FASTA. minimap2 maps the raw reads against it, and then
# each per-cell FASTA.
#
# The fixture's 600 nt template, whose region model is the gff below. Note this
# is NOT tests/data/template.fasta -- that one belongs to the barcode-extraction
# fixture and nothing aligns to it.
template: "tests/data/mapping/template.fasta"

# PacBio CCS. Use map-ont for Nanopore; getting this wrong costs alignment
# sensitivity rather than failing.
minimap_preset: "map-hifi"

# Call genotypes against the GENOME, not against the consensus across cells.
# Must be the same file as `template`. Unset, anything the population shares is
# absorbed into the "reference" and vanishes -- and at a variant column that
# splits evenly the tie is broken alphabetically, so the reference base comes
# out arbitrary and the cells matching the template are reported as the mutants.
reference: "tests/data/mapping/template.fasta"

# --- Region-aware annotation ------------------------------------------------- #
# A GFF3 annotates mutations against a genome region model instead of assuming
# one ORF read in frame 1 from base 1, which gets UTRs and residue numbering
# wrong on a real viral genome. README.md's "Annotating by genome region"
# explains the format and what it adds; `whole_reference: true` gets genome
# coordinates without one.
#
# Setting it also switches the consensus stage into whole-reference mode,
# because region lookup needs genome coordinates and the default mode renumbers
# positions relative to the ORF.
#
# The fixture's region model: 5'UTR 1-149, CDS 150-500 (+ strand, phase 0),
# 3'UTR 501-600. The CDS deliberately does not start at position 1, so a run
# exercises frame-correct residue numbering rather than assuming frame 1.
gff: "tests/data/mapping/regions.gff3"

# --- the analysis window and the cell filter --------------------------------- #
# Setting `gff` above puts the consensus stage in whole-reference mode, where
# these bounds stop being a cut and become the columns variants are called over.
# Positions stay genome coordinates either way.
#
# `window: cds` takes the window from the GFF's CDS, which is what a real run
# wants -- see workflow/config_cluster.yaml. Here it is given explicitly for two
# reasons: the fixture's reads cover only template [50, 550), so the window has
# to sit inside that, and one of the two planted variants is in the 5'UTR, which
# a CDS window would exclude. Keeping both in view is the point of the example:
# it produces a coding call AND a non-coding one.
orf_start: 60
orf_end: 540

# THE CELL FILTER: a cell counts if the coding sequence is complete at depth.
# min_breadth 1.0 says every position in the window must be called;
# cons_min_depth says how many reads that takes. This pair is the published
# rule -- Dábilla & Dolan (2024) kept cells with the full coding sequence at
# 10-fold depth per site -- and it replaced depth_min, which conflated depth
# with breadth. workflow/config_cluster.yaml has the numbers behind that.
#
# 5 here is the package default, kept because the fixture has 8 reads per cell.
# A real run reproducing the paper wants 10.
min_breadth: 1.0
cons_min_depth: 5
cons_threshold: 0.5
depth_min: 0

# Reads a barcode needs before it becomes a cell. The fixture gives each of its
# six cells 8, so this keeps all of them and would drop stray mis-assignments.
min_reads: 8

# The fixture's barcodes are exact whitelist entries, so nothing needs correcting
# -- but leaving this unset means any read is assigned to its NEAREST entry with
# no floor, which on real data turns unreadable barcodes into plausible cells.
#
# On a real run this is also the stage's biggest RUNTIME lever: barcode
# assignment is ~90% of extract's time, and 2 costs roughly 7.6x what 1 does to
# recover the last 15% of reads. workflow/config_cluster.yaml has the measured
# table, including the case where leaving it unset beats setting it.
max_barcode_errors: 2

# The second analysis, over every mapped cell rather than the filtered subset:
# {reads carrying an allele} / {reads at that position}, with a per-position
# denominator. Adds _alleleFrequencies.csv and _cellAlleleFreq.csv.
allele_frequencies: true

# --- cluster resources ------------------------------------------------------- #
# Only read when you submit with --executor slurm; ignored on a local run.
# Without them every job goes in at the partition default, and extract is killed
# on a node with plenty free.
#
# reads_estimate is how many reads the run is expected to yield after mapping.
# It sizes the fasta stage, which pulls the whole anchovy table into memory --
# every read's mapped sequence -- at a measured 6.3 KB per read. Nothing else
# scales with it. The default of 10 million asks for ~84 GB; this fixture has
# 48 reads, hence the small value here.
reads_estimate: 1000

# Per-rule overrides, if a reservation is wrong for your data. The defaults are
# computed in the Snakefile from measured figures; extract's follows chemistry,
# extract_threads and extract_chunk_size on its own.
#   mem_mb:
#     extract: 200000
#   runtime:            # minutes
#     extract: 480

# --- extract stage resources ------------------------------------------------- #
# MEMORY IS BOUNDED BY THE CHUNK, NOT BY THE RUN. extract reads the SAM, runs
# both passes and writes its output a chunk at a time, so its footprint is
#
#     GB  =  W  +  extract_threads x ( W  +  4.6 KB x extract_chunk_size )
#
#                     W = 0.4 GB   v2 whitelist    (737,280 barcodes)
#                     W = 2.8 GB   v3 whitelist  (6,794,880 barcodes)
#                     W ~ 0        a small run-specific list
#
# W IS THE WHITELIST'S LOOKUP TABLES, AND IT IS PAID ONCE PER WORKER. They are
# read-only and identical in every worker, but fork's copy-on-write does not
# save them: CPython's refcounts touch every object, so each worker ends up
# holding its own copy. Measured, not assumed -- 0.42 GB per worker at v2,
# 2.75 GB at v3, dead linear in the worker count.
#
# On a full whitelist W dwarfs the chunk term -- 2.75 GB against 0.46 GB at a
# 100,000-read chunk -- so extract_threads is effectively the only memory knob
# that matters, and chunking buys much less than it does on a small list:
#
#     v3, 100,000-read chunks:   4 threads   16 GB
#                                8 threads   28 GB
#                               16 threads   54 GB
#                               64 threads  208 GB
#
# An earlier version of this comment gave the chunk term alone and put 64
# threads at 7.7 GB. Against a v3 whitelist the real figure is 208 GB.
#
# W DEPENDS ON max_barcode_errors TOO. The per-barcode template array is only
# built when something will scan it, which is only when max_barcode_errors is
# unset -- a bounded search resolves to one index and rebuilds that one
# template. Setting it therefore cuts W as well as the runtime:
#
#                        W bounded     W unset
#     v2                   0.2 GB       0.4 GB
#     v3                   1.1 GB       2.8 GB
#
# and the v3 tables build in 10s rather than 31s.
#
# measured on a PacBio-shaped SAM, whatever the size of the run. Before it was
# chunked this scaled with the read count instead: at eleven million reads the
# sequences alone are ~22 GB, and such a run dies to the kernel with
# "died with <Signals.SIGKILL: 9>" and nothing else, because SIGKILL cannot be
# caught.
#
# Lower either knob on a tight node. extract_threads costs wall time in
# proportion; extract_chunk_size costs almost nothing until the chunks get
# small enough that pool dispatch shows up.
#
# extract_threads defaults to 16 (capped by snakemake's --cores);
# extract_chunk_size defaults to 100,000.
# extract_threads: 8
# extract_chunk_size: 100000
