# Full-scale cluster run. Paths below match what fetch.sh prints when it
# finishes -- copy them from its output rather than assuming.
#
# KEEP RUN DATA OUT OF THE REPOSITORY. Every path here points at a directory
# beside the checkout, not inside it, so that deleting or re-cloning the repo
# cannot take the data with it. The default in fetch.sh writes into
# examples/eva71_sra/data, which is convenient for the example and wrong for a
# real run: an `rm -rf anchovy/` there costs the mapped SAM as well as the code.
# Set DATA_DIR when you fetch, and point these at the same place.
#
# Both steps, with these paths already filled in:
#
#   bash examples/eva71_sra/run_cluster.sh
#   DRY_RUN=1 bash examples/eva71_sra/run_cluster.sh     # plan only
#
# That maps the reads where they live and runs the workflow. It also checks
# that its DATA_DIR matches data_dir below, since a mismatch means the workflow
# hunts for a SAM that was just written somewhere else.
#
# By hand, if you prefer:
#
#   DATA=/data/lvd_qve/Projects/PacBio_virus-inclusive_EVA71Passage/anchovy_run
#   FASTQ=<the reads: source below> DATA_DIR="$DATA" THREADS=64 \
#     bash examples/eva71_sra/fetch.sh
#   snakemake -s workflow/Snakefile --configfile workflow/config_cluster.yaml \
#     --cores 64 -n
#
# The -n first: the map_cell count is the surviving barcode count, and dividing
# by --group-components gives the number of SLURM submissions if you submit.

# --- paths ---------------------------------------------------------------- #
# Reads are taken from {data_dir}/{sample}.sam. fetch.sh derives this name from
# the FASTQ's basename; run it with SAMPLE=5_EVA71_6h_P5 to drop the .ccs.
sample: "5_EVA71_6h_P5.ccs"

# Where the reads came from. Not read by the workflow -- its input is the SAM
# that fetch.sh maps from here -- but recorded so the provenance of a results
# directory is answerable from the config that produced it. run_cluster.sh maps
# straight from this path; the FASTQ is never copied or staged.
reads: "/data/lvd_qve/Sequencing_Data/QVEU_Seq_0065_PacBio_NDAS_SearchSeq-EVA71Passage/Analysis_r54242Ue_20230322_183435_8_H01/Sample_5_EVA71_6h_P5/5_EVA71_6h_P5.ccs.fastq"
data_dir: "/data/lvd_qve/Projects/PacBio_virus-inclusive_EVA71Passage/anchovy_run"

# Genome the reads were mapped to.
template: "/data/lvd_qve/Projects/PacBio_virus-inclusive_EVA71Passage/anchovy_run/AF304458.fasta"

# Call genotypes against the genome, not the consensus across cells. Unset,
# anything fixed in the population is absorbed into the reference and vanishes.
# Must be the same file as `template`.
reference: "/data/lvd_qve/Projects/PacBio_virus-inclusive_EVA71Passage/anchovy_run/AF304458.fasta"

# Must match the name after ">" in `template`.
reference_name: "AF304458.1"

# 10X v2 (737,280 barcodes).
whitelist: "/data/lvd_qve/Projects/PacBio_virus-inclusive_EVA71Passage/anchovy_run/737K-august-2016.txt"

# 26 Ns = 16 nt barcode + 10 nt UMI. v3 is 28 Ns and the v3 whitelist.
signature: "CTACACGACGCTCTTCCGATCTNNNNNNNNNNNNNNNNNNNNNNNNNNTTTCTTATAT"

# Region model. Also switches genotype positions to genome coordinates.
gff: "/data/lvd_qve/Projects/PacBio_virus-inclusive_EVA71Passage/anchovy_run/AF304458.gff3"

# --- filters -------------------------------------------------------------- #
# Reads a barcode needs to become two jobs (map_cell + cell_consensus).
# coverage <= n_reads always, so min_reads = depth_min discards only cells that
# could never have passed. Raise it to cut the job count -- a cell realistically
# needs depth_min x genome_length / mean_read_length reads.
min_reads: 20

# Worker processes for the extract stage's own multiprocessing Pool.
#
# NOT snakemake's --cores, which governs how many JOBS run at once; extract is
# a single job whose pool is sized separately. Left unset it is 16 however
# large the node, which is what made this stage take four hours on a 64-core
# machine.
extract_threads: 64

# THE CELL FILTER: a cell counts if the CODING SEQUENCE is complete at depth.
#
# depth_min is off because the number it tests is not a depth. sam2consensus
# computes the `coverage:` field it writes as (summed depth over positions with
# reads) / (FULL reference length), so it falls whenever a cell spans less of
# the genome however deep its reads were. On this dataset it cut 382 of 832
# cells, 122 of which had >20x where they called a base AND >=50% of the genome
# -- and it kept cells covering 20% of the genome over cells with twice the
# depth. Zero disables it; min_breadth and the window below replace it.
depth_min: 0

# Take the analysis window from the GFF's CDS rather than hand-written bounds.
# The window is 0-based half-open and GFF3 is 1-based inclusive, so copying CDS
# coordinates by hand needs an off-by-one on the start only -- and a wrong one
# shifts which positions are called and which cells count as complete, without
# failing. Set orf_start/orf_end instead to name a different window.
window: cds

# Every position in that window must be called. Combined with cons_min_depth
# below, THIS IS THE RULE: complete coding sequence at the depth floor.
#
# 1.0 is a real boundary here, not a round number. Gaps arrive as runs, not
# scattered bases, so cells either tile the window or miss a stretch of it: of
# 832 cells, 160 had zero gaps across the polyprotein and only 9 more had
# between 1 and 10. There is no population sitting just below the bar.
#
# NOTE this is measured over the window, so the ragged 5'/3' flanks every
# amplicon run has do not count against a cell. Whole-genome, ZERO of the 832
# cells are gap-free -- 1.0 without a window empties the table.
min_breadth: 1.0

# Optional second bar: mean depth at the positions actually called. Off, since
# min_breadth + cons_min_depth already state the rule; set it to also require
# the covered positions be deep on average, not merely present.
# min_depth_called: 20

# THE DEPTH FLOOR, and with min_breadth: 1.0 above the other half of the rule:
# every position in the CDS must reach this many reads or the cell is dropped.
#
# 3 is permissive. Two things to check on the first run at this setting, both
# reported by the consensus stage: insertions get easier to call at low depth,
# and a cell carrying one is no longer reference length, so it cannot be
# genotyped by position and is dropped (counted, and named in the output);
# ambiguity codes also multiply, and an ambiguous position is not a gap -- it
# passes min_breadth but is skipped when genotypes are called. If either count
# is large, this floor is too low and 5 is the next thing to try.
cons_min_depth: 3

# Leave at 0.5. Raising it emits MORE IUPAC ambiguity codes, not fewer.
cons_threshold: 0.5

# --- allele frequencies --------------------------------------------------- #
# A SECOND ANALYSIS OVER ALL MAPPED CELLS, not the subset above.
#
# The genotype network needs comparable genotype strings, which is why the
# filters above demand a complete coding sequence. A frequency does not, and
# filtering for it actively hurts: what a frequency needs is an honest
# denominator, so this stage takes one PER POSITION. A cell covering part of
# the CDS counts where it has data and is absent where it does not, so nothing
# is discarded for partial coverage and no cell inflates a denominator it
# cannot speak to.
#
# Produces two tables:
#   <sample>_alleleFrequencies.csv  one row per position and non-reference
#       allele. Reports the frequency over all mapped cells (one cell, one
#       vote), over the network's subset, and over summed reads -- side by
#       side, so the subset can be checked for bias rather than assumed
#       representative.
#   <sample>_cellAlleleFreq.csv     one row per cell, position and allele:
#       reads carrying it over depth there. This is the within-cell
#       quasispecies view, and it sees mixtures the consensus hides -- a cell
#       at 25% variant calls pure reference in its own consensus.
#
# PREFER THE CELL COLUMNS FOR POPULATION CLAIMS. Reads within a cell are RT/PCR
# copies of a few templates, so the read columns weight each cell by its depth:
# a 200-read cell outvotes a 20-read cell tenfold there, and not at all in the
# cell columns.
#
# Costs one extra file per cell (the pileup) and one pass over them.
allele_frequencies: true

# Per-cell table: minimum reads carrying an allele before it gets a row, and
# minimum within-cell fraction. Every covered position carries singleton error
# reads, so 1 reports the error spectrum rather than the variants.
# min_alt_reads: 2
# min_alt_freq: 0.0

# Population table: minimum cells calling an allele before it gets a row.
# min_cells_per_allele: 1

# --- optional ------------------------------------------------------------- #
# How many errors the assigned BARCODE may carry before the read is dropped.
#
# Unset, every read is assigned to its NEAREST whitelist entry with no floor,
# so a read whose barcode was unreadable still becomes a cell, a consensus and
# a genotype. On this dataset 43.7% of reads had no exact whitelist barcode and
# were all assigned anyway.
#
# 2 is the ceiling worth allowing. The whitelist is 0.017% of 16-mer space, so
# the expected number of whitelist barcodes within a given distance is:
#
#     1 error   0.008   effectively always unique
#     2 errors  0.194   usually unique
#     3 errors  2.789   AMBIGUOUS -- "nearest" is a coin flip
#
# Setting this also makes the stage far faster, because a bounded search
# enumerates the neighbourhood (1,128 lookups at 2 errors) instead of scanning
# all 737,280 entries. Reads beyond the limit are never scanned at all.
#
# Note it switches assignment from nearest-neighbour Levenshtein to exact-or-
# within-k substitutions, which is what 10X's own correction does. A barcode
# carrying an indel is dropped rather than assigned to an arbitrary neighbour.
max_barcode_errors: 2

# Keep IUPAC codes as genotype tokens. Off by default: they mark positions where
# reads disagreed, not mutations. Worth one run with it on at full depth.
# keep_ambiguous: true

# Explicit window, overriding `window: cds` above. Renumbers nothing.
# orf_start: 700
# orf_end: 7300

# Keep self-loops in the epistatic network (the original R behavior).
# self_edges: true
