# Full-scale cluster run. Paths below match what fetch.sh prints when it
# finishes -- copy them from its output rather than assuming.
#
#   FASTQ=/data/lvd_qve/GitHub/anchovy/examples/eva71_sra/5_EVA71_6h_P5.ccs.fastq \
#     THREADS=16 bash examples/eva71_sra/fetch.sh
#
#   snakemake -s workflow/Snakefile --configfile workflow/config_cluster.yaml \
#     --executor slurm --jobs 200 --group-components cell=200
#
# Add -n first: the map_cell count is the surviving barcode count, and dividing
# by --group-components gives the number of SLURM submissions.

# --- paths ---------------------------------------------------------------- #
# Reads are taken from {data_dir}/{sample}.sam. fetch.sh derives this name from
# the FASTQ's basename; run it with SAMPLE=5_EVA71_6h_P5 to drop the .ccs.
sample: "5_EVA71_6h_P5.ccs"
data_dir: "/data/lvd_qve/GitHub/anchovy/examples/eva71_sra/data"

# Genome the reads were mapped to.
template: "/data/lvd_qve/GitHub/anchovy/examples/eva71_sra/data/AF304458.fasta"

# Call genotypes against the genome, not the consensus across cells. Unset,
# anything fixed in the population is absorbed into the reference and vanishes.
# Must be the same file as `template`.
reference: "/data/lvd_qve/GitHub/anchovy/examples/eva71_sra/data/AF304458.fasta"

# Must match the name after ">" in `template`.
reference_name: "AF304458.1"

# 10X v2 (737,280 barcodes).
whitelist: "/data/lvd_qve/GitHub/anchovy/examples/eva71_sra/data/737K-august-2016.txt"

# 26 Ns = 16 nt barcode + 10 nt UMI. v3 is 28 Ns and the v3 whitelist.
signature: "CTACACGACGCTCTTCCGATCTNNNNNNNNNNNNNNNNNNNNNNNNNNTTTCTTATAT"

# Region model. Also switches genotype positions to genome coordinates.
gff: "/data/lvd_qve/GitHub/anchovy/examples/eva71_sra/data/AF304458.gff3"

# --- filters -------------------------------------------------------------- #
# Reads a barcode needs to become two jobs (map_cell + cell_consensus).
# coverage <= n_reads always, so min_reads = depth_min discards only cells that
# could never have passed. Raise it to cut the job count -- a cell realistically
# needs depth_min x genome_length / mean_read_length reads.
min_reads: 20

# Per-cell mean coverage to enter the consensus stage.
depth_min: 20

# Per-position depth for sam2consensus to call a position; below it, gap-filled.
cons_min_depth: 10

# Leave at 0.5. Raising it emits MORE IUPAC ambiguity codes, not fewer.
cons_threshold: 0.5

# --- optional ------------------------------------------------------------- #
# Keep IUPAC codes as genotype tokens. Off by default: they mark positions where
# reads disagreed, not mutations. Worth one run with it on at full depth.
# keep_ambiguous: true

# Restrict which positions variants are called over. Renumbers nothing.
# orf_start: 700
# orf_end: 7300

# Keep self-loops in the epistatic network (the original R behavior).
# self_edges: true
