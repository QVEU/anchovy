# Full-scale cluster run for the QVEU EV-A71 dataset.
#
# ONE COMMAND, no scripts:
#
#   snakemake -s workflow/Snakefile --configfile workflow/config_cluster.yaml \
#       --cores 64 -n          # plan first
#   snakemake -s workflow/Snakefile --configfile workflow/config_cluster.yaml \
#       --cores 64
#
# The workflow reads every FASTQ in `input_dir`, maps it, runs it through to the
# rendered report, and names the outputs after it. Nothing else to run:
# examples/eva71_sra/fetch.sh only downloads the public example data.
#
# The -n first: the map_cell count is the surviving barcode count across all
# samples, and dividing by --group-components gives the number of SLURM
# submissions if you submit.
#
# KEEP RUN DATA OUT OF THE REPOSITORY. Every path here points outside the
# checkout, and the outputs follow the reads rather than the shell: they land in
# <input_dir>/results/<sample>/, so deleting or re-cloning anchovy cannot take a
# run with it, and the same command gives the same files from any login node.

# --- input ------------------------------------------------------------------ #
# A FOLDER OF FASTQs, not a sample name. Every FASTQ in here is run through the
# whole pipeline -- map, extract, per-cell consensus, genotypes, networks,
# report -- and its outputs are named after it, in <input_dir>/results/<name>/.
# Add a second sample by dropping its FASTQ in beside the first.
#
# This folder is also where the run lives: results/ and resources/ are created
# inside it. Your reads are never written to. On a read-only data mount, set
# `results_dir` and `resources_dir` (see workflow/config.yaml) to send them
# somewhere writable instead.
input_dir: "/data/lvd_qve/Sequencing_Data/QVEU_Seq_0065_PacBio_NDAS_SearchSeq-EVA71Passage/Analysis_r54242Ue_20230322_183435_8_H01/Sample_5_EVA71_6h_P5"

# Genome the reads are mapped to. The reference NAME is read from this file's
# own FASTA header, so there is no second key to keep in sync with it.
template: "/data/lvd_qve/Projects/PacBio_virus-inclusive_EVA71Passage/anchovy_run/AF304458.fasta"

# Call genotypes against the genome, not the consensus across cells. Unset,
# anything fixed in the population is absorbed into the reference and vanishes
# -- on this dataset that would hide E710Q, which every surviving cell carries.
# Must be the same file as `template`.
reference: "/data/lvd_qve/Projects/PacBio_virus-inclusive_EVA71Passage/anchovy_run/AF304458.fasta"

# minimap2 preset: map-hifi for PacBio CCS, map-ont for Nanopore. Wrong here
# costs alignment sensitivity rather than failing.
minimap_preset: "map-hifi"
map_threads: 64

# --- 10X chemistry ----------------------------------------------------------- #
# ONE key sets the signature and the whitelist together, because they have to
# agree: the signature's N-run gives the UMI width, the whitelist is
# chemistry-specific, and mismatching them does not fail -- every read is
# assigned to its nearest entry in the wrong list and the output looks ordinary.
#
# This dataset is v2. Both chemistries download automatically into
# <input_dir>/resources/; the local copy below is used instead, so nothing is
# fetched.
chemistry: "v2"
whitelist: "/data/lvd_qve/Projects/PacBio_virus-inclusive_EVA71Passage/anchovy_run/737K-august-2016.txt"

# Region model. Also switches genotype positions to genome coordinates.
gff: "/data/lvd_qve/Projects/PacBio_virus-inclusive_EVA71Passage/anchovy_run/AF304458.gff3"

# --- filters -------------------------------------------------------------- #
# Reads a barcode needs to become two jobs (map_cell + cell_consensus).
# coverage <= n_reads always, so min_reads = depth_min discards only cells that
# could never have passed. Raise it to cut the job count -- a cell realistically
# needs depth_min x genome_length / mean_read_length reads.
min_reads: 20

# Worker processes for the extract stage's own multiprocessing Pool.
#
# NOT snakemake's --cores, which governs how many JOBS run at once; extract is
# a single job whose pool is sized separately. Left unset it is 16 however
# large the node, which is what made this stage take four hours on a 64-core
# machine.
#
# MEMORY IS BOUNDED BY THE CHUNK, NOT BY THE RUN. extract reads the SAM, runs
# both passes and writes its output a chunk at a time, so its footprint is
#
#     GB  =  W  +  extract_threads x ( W  +  4.6 KB x extract_chunk_size )
#
#                     W = 0.4 GB   v2 whitelist    (737,280 barcodes)
#                     W = 2.8 GB   v3 whitelist  (6,794,880 barcodes)
#                     W ~ 0        a small run-specific list
#
# W IS THE WHITELIST'S LOOKUP TABLES, AND IT IS PAID ONCE PER WORKER. They are
# read-only and identical in every worker, but fork's copy-on-write does not
# save them: CPython's refcounts touch every object, so each worker ends up
# holding its own copy. Measured, not assumed -- 0.42 GB per worker at v2,
# 2.75 GB at v3, dead linear in the worker count.
#
# On a full whitelist W dwarfs the chunk term -- 2.75 GB against 0.46 GB at a
# 100,000-read chunk -- so extract_threads is effectively the only memory knob
# that matters, and chunking buys much less than it does on a small list:
#
#     v3, 100,000-read chunks:   4 threads   16 GB
#                                8 threads   28 GB
#                               16 threads   54 GB
#                               64 threads  208 GB
#
# An earlier version of this comment gave the chunk term alone and put 64
# threads at 7.7 GB. Against a v3 whitelist the real figure is 208 GB.
#
# W DEPENDS ON max_barcode_errors TOO. The per-barcode template array is only
# built when something will scan it, which is only when max_barcode_errors is
# unset -- a bounded search resolves to one index and rebuilds that one
# template. Setting it therefore cuts W as well as the runtime:
#
#                        W bounded     W unset
#     v2                   0.2 GB       0.4 GB
#     v3                   1.1 GB       2.8 GB
#
# and the v3 tables build in 10s rather than 31s.
#
# measured on a PacBio-shaped SAM, whatever the size of the run. Before it was
# chunked this scaled with the read count instead: at eleven million reads the
# sequences alone are ~22 GB, and such a run dies to the kernel with
# "died with <Signals.SIGKILL: 9>" and nothing else, because SIGKILL cannot be
# caught.
#
# Lower either knob on a tight node. extract_threads costs wall time in
# proportion; extract_chunk_size costs almost nothing until the chunks get
# small enough that pool dispatch shows up.
#
# 64 workers at the default 100,000-read chunk is ~29 GB, which suits a
# dedicated large-memory node. Halve both on a shared one.
extract_threads: 64
# extract_chunk_size: 100000

# THE CELL FILTER: a cell counts if the CODING SEQUENCE is complete at depth.
#
# depth_min is off because the number it tests is not a depth. sam2consensus
# computes the `coverage:` field it writes as (summed depth over positions with
# reads) / (FULL reference length), so it falls whenever a cell spans less of
# the genome however deep its reads were. On this dataset it cut 382 of 832
# cells, 122 of which had >20x where they called a base AND >=50% of the genome
# -- and it kept cells covering 20% of the genome over cells with twice the
# depth. Zero disables it; min_breadth and the window below replace it.
depth_min: 0

# Take the analysis window from the GFF's CDS rather than hand-written bounds.
# The window is 0-based half-open and GFF3 is 1-based inclusive, so copying CDS
# coordinates by hand needs an off-by-one on the start only -- and a wrong one
# shifts which positions are called and which cells count as complete, without
# failing. Set orf_start/orf_end instead to name a different window.
window: cds

# Every position in that window must be called. Combined with cons_min_depth
# below, THIS IS THE RULE: complete coding sequence at the depth floor.
#
# 1.0 is a real boundary here, not a round number. Gaps arrive as runs, not
# scattered bases, so cells either tile the window or miss a stretch of it: of
# 832 cells, 160 had zero gaps across the polyprotein and only 9 more had
# between 1 and 10. There is no population sitting just below the bar.
#
# NOTE this is measured over the window, so the ragged 5'/3' flanks every
# amplicon run has do not count against a cell. Whole-genome, ZERO of the 832
# cells are gap-free -- 1.0 without a window empties the table.
min_breadth: 1.0

# Optional second bar: mean depth at the positions actually called. Off, since
# min_breadth + cons_min_depth already state the rule; set it to also require
# the covered positions be deep on average, not merely present.
# min_depth_called: 20

# THE DEPTH FLOOR, and with min_breadth: 1.0 above the other half of the rule:
# every position in the CDS must reach this many reads or the cell is dropped.
#
# NOTE THE PUBLISHED METHOD USED 10. Dábilla & Dolan (2024) limited the analysis
# to cells with the full coding sequence recovered "at sufficient depth per site
# (10-fold)", which is this key together with min_breadth: 1.0 above. 3 here is
# well below that, so a run at this setting is NOT reproducing the paper's
# filtering -- raise it to 10 to do that, and expect fewer cells.
#
# 3 is permissive. Two things to check on the first run at this setting, both
# reported by the consensus stage: insertions get easier to call at low depth,
# and a cell carrying one is no longer reference length, so it cannot be
# genotyped by position and is dropped (counted, and named in the output);
# ambiguity codes also multiply, and an ambiguous position is not a gap -- it
# passes min_breadth but is skipped when genotypes are called. If either count
# is large, this floor is too low and 5 is the next thing to try.
cons_min_depth: 3

# Leave at 0.5. Raising it emits MORE IUPAC ambiguity codes, not fewer.
cons_threshold: 0.5

# --- cluster resources ------------------------------------------------------- #
# Read when you submit with --executor slurm. WITHOUT THEM EVERY JOB GOES IN AT
# THE PARTITION DEFAULT, and extract is killed on a node with a terabyte free --
# the same SIGKILL as too small a hand-made allocation, only blamed on the
# cluster.
#
# reads_estimate: reads expected AFTER mapping and the length filter. It sizes
# the fasta stage, which pulls the whole anchovy table into memory -- every
# read's mapped sequence -- at a measured 6.3 KB per read, so 10 million reads
# is ~84 GB. Nothing else scales with it: extract is chunked, and the per-cell
# rules see one cell each.
reads_estimate: 10000000

# Overrides, if a reservation is wrong for your data. The defaults are computed
# in the Snakefile from measured figures, and extract's follows chemistry,
# extract_threads and extract_chunk_size on its own.
#   mem_mb:
#     extract: 200000
#   runtime:            # minutes
#     extract: 480

# --- allele frequencies --------------------------------------------------- #
# A SECOND ANALYSIS OVER ALL MAPPED CELLS, not the subset above.
#
# The genotype network needs comparable genotype strings, which is why the
# filters above demand a complete coding sequence. A frequency does not, and
# filtering for it actively hurts: what a frequency needs is an honest
# denominator, so this stage takes one PER POSITION. A cell covering part of
# the CDS counts where it has data and is absent where it does not, so nothing
# is discarded for partial coverage and no cell inflates a denominator it
# cannot speak to.
#
# Produces two tables:
#   <sample>_alleleFrequencies.csv  one row per position and non-reference
#       allele. Reports the frequency over all mapped cells (one cell, one
#       vote), over the network's subset, and over summed reads -- side by
#       side, so the subset can be checked for bias rather than assumed
#       representative.
#   <sample>_cellAlleleFreq.csv     one row per cell, position and allele:
#       reads carrying it over depth there. This is the within-cell
#       quasispecies view, and it sees mixtures the consensus hides -- a cell
#       at 25% variant calls pure reference in its own consensus.
#
# PREFER THE CELL COLUMNS FOR POPULATION CLAIMS. Reads within a cell are RT/PCR
# copies of a few templates, so the read columns weight each cell by its depth:
# a 200-read cell outvotes a 20-read cell tenfold there, and not at all in the
# cell columns.
#
# Costs one extra file per cell (the pileup) and one pass over them.
allele_frequencies: true

# Per-cell table: minimum reads carrying an allele before it gets a row, and
# minimum within-cell fraction. Every covered position carries singleton error
# reads, so 1 reports the error spectrum rather than the variants.
# min_alt_reads: 2
# min_alt_freq: 0.0

# Population table: minimum cells calling an allele before it gets a row.
# min_cells_per_allele: 1

# --- optional ------------------------------------------------------------- #
# How many errors the assigned BARCODE may carry before the read is dropped.
#
# Unset, every read is assigned to its NEAREST whitelist entry with no floor,
# so a read whose barcode was unreadable still becomes a cell, a consensus and
# a genotype. On this dataset 43.7% of reads had no exact whitelist barcode and
# were all assigned anyway.
#
# 2 is the ceiling worth allowing. The whitelist is 0.017% of 16-mer space, so
# the expected number of whitelist barcodes within a given distance is:
#
#     1 error   0.008   effectively always unique
#     2 errors  0.194   usually unique
#     3 errors  2.789   AMBIGUOUS -- "nearest" is a coin flip
#
# IT IS ALSO THE STAGE'S BIGGEST RUNTIME LEVER, and not in the direction this
# comment used to claim. Barcode assignment is ~90% of extract's time on real
# data -- the signature search is noise beside it -- and essentially all of that
# is spent on the reads whose barcode is NOT an exact whitelist hit. Measured on
# 40,000 reads, 44% of them inexact, 4 workers:
#
# THE WHOLE STAGE, end to end, against a 20,000-barcode list:
#
#     2      21.6 s   1,849 reads/s   100% of reads assigned
#     1       6.4 s   6,235 reads/s    85%
#     0       4.7 s   8,482 reads/s    56%
#
# So 1 is 3.4x faster than 2 in wall clock. The barcode step alone differs by
# 7.6x (14.4 s against 1.9 s) -- quote the 3.4x, since that is what a run
# actually takes; the 7.6x is the part of it this setting touches.
#
# The same step against a 2,000-barcode list, which is where the second point
# below comes from:
#
#     1       1.8 s
#     2      10.8 s
#     unset   8.4 s
#
# TWO THINGS TO READ OFF THAT. First, the 15% that 2 recovers over 1 are the
# reads whose barcode needed TWO corrections -- the least trustworthy
# assignments in the run -- so dropping them tightens the data as well as the
# clock. The 2-error neighbourhood of a 16-mer is ~1,128 candidates against 48
# for one error, which is where the time goes. If a run is taking hours, this
# is the knob.
#
# Second, the bounded search is NOT unconditionally faster than the scan it
# replaces. Its cost is fixed -- the same ~1,128 lookups whatever the whitelist
# holds -- while the scan is linear in the list. Against 10X's 737,280 entries
# the bound wins enormously; against a run-specific list of a couple of thousand
# barcodes from Cell Ranger, leaving it unset was faster than setting it to 2.
# Check your own list's length before assuming.
#
# Note it switches assignment from nearest-neighbour Levenshtein to exact-or-
# within-k substitutions, which is what 10X's own correction does. A barcode
# carrying an indel is dropped rather than assigned to an arbitrary neighbour.
max_barcode_errors: 2

# Keep IUPAC codes as genotype tokens. Off by default: they mark positions where
# reads disagreed, not mutations. Worth one run with it on at full depth.
# keep_ambiguous: true

# Explicit window, overriding `window: cds` above. Renumbers nothing.
# orf_start: 700
# orf_end: 7300

# Keep self-loops in the epistatic network (the original R behavior).
# self_edges: true
