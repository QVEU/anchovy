# examples/eva71_sra/config.yaml
#
# Settings for the EV-A71 / SRR28178313 example. Run examples/eva71_sra/fetch.sh
# first -- it downloads the data and prints the two values you have to fill in
# below. Then:
#
#   snakemake -s workflow/Snakefile --configfile examples/eva71_sra/config.yaml --cores 8

# --- Sample and input location --------------------------------------------- #
# The workflow expects the mapped reads at {data_dir}/{sample}.sam, which is
# exactly what fetch.sh produces.
sample: "SRR28178313"
data_dir: "examples/eva71_sra/data"

# --- 10X barcode whitelist -- YOU MUST SET THIS ----------------------------- #
# Not redistributable, and not downloadable by fetch.sh. It ships with Cell
# Ranger:
#   v2 chemistry: .../cellranger/barcodes/737K-august-2016.txt
#   v3 chemistry: .../3M-february-2018.txt.gz  (gunzip first)
# Match it to the chemistry the run actually used -- the signature below is the
# v2 layout (16 nt barcode + 10 nt UMI).
whitelist: "/path/to/737K-august-2016.txt"     # <<< EDIT ME

# The 10X signature searched for in each read. The N-run is the barcode+UMI
# region: 26 Ns here = 16 + 10. This is the default anchovy ships with and the
# one the original AnchovyJob.sh used.
signature: "CTACACGACGCTCTTCCGATCTNNNNNNNNNNNNNNNNNNNNNNNNNNTTTCTTATAT"

# --- Reference -------------------------------------------------------------- #
# Downloaded by fetch.sh. reference_name must match the name after ">" in the
# FASTA, because sam2consensus prefixes its per-cell output files with it --
# fetch.sh prints the right value when it finishes.
template: "examples/eva71_sra/data/AF304458.fasta"
reference_name: "AF304458.1"                   # <<< CONFIRM against fetch.sh output

# --- Region-aware annotation ------------------------------------------------ #
# Derived by fetch.sh from the reference's own GenBank annotation, so the
# coordinates are not hand-copied. For a picornavirus this gives you the
# polyprotein CDS plus a mature_protein_region per cleavage product (VP1-VP4,
# 2A-2C, 3A-3D), which is the overlapping-region case: a mutation in VP1 is
# reported twice, numbered within VP1 and within the polyprotein.
#
# Setting this also switches the consensus stage to whole-reference mode, so
# positions stay genome coordinates.
gff: "examples/eva71_sra/data/AF304458.gff3"

# --- Analysis window (optional) --------------------------------------------- #
# In whole-reference mode orf_start/orf_end do not trim anything; they only say
# which columns to call variants over, which is how you exclude ragged,
# poorly-covered ends. Left unset here because the right window depends on where
# THIS run actually has coverage -- look at the per-cell consensuses from a first
# pass, then set it. 0-based, half-open.
#
# orf_start: 700
# orf_end: 7300

# --- Thresholds -------------------------------------------------------------- #
# sam2consensus: minimum depth and the consensus-calling threshold per position.
cons_threshold: 0.5
cons_min_depth: 5

# Minimum per-cell coverage to keep a cell in the consensus stage. The default is
# 10; raise it for a deeply sequenced run, lower it if you are losing cells you
# expected to keep.
depth_min: 10

# Keep each genotype's self-edge in the epistatic network (the original R
# behavior). Off by default -- Cytoscape draws them as a loop on every node.
# self_edges: true
